          imageLink.setAttribute('data-pswp-width', String(meta.width));
          imageLink.setAttribute('data-pswp-height', String(meta.height));
        }

        gallery: '#gallery-container',
        children: 'a',
        pswpModule: PhotoSwipe,
      });

      lightbox.addFilter('thumbEl', function (thumbEl, data) {
        const el = galleryContainer.querySelector('[data-id="' + data.id + '"] img');
        return el || thumbEl;
      });

      lightbox.addFilter('placeholderSrc', function (placeholderSrc, slide) {
        const el = galleryContainer.querySelector('[data-id="' + slide.data.id + '"] img');

  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function() {
        document.body.classList.toggle('oregon-trail-theme');
        var on = document.body.classList.contains('oregon-trail-theme');
        localStorage.setItem('bsdc-theme', on ? 'oregon-trail' : '');
        btn.textContent = on ? '✨ Back to normal' : '🦌 Oregon Trail';
      });
      if (document.body.classList.contains('oregon-trail-theme')) {
        btn.textContent = '✨ Back to normal';
      }
    })();
  </script>
  <script>
    (function () {
      var toggle = document.querySelector('.nav-more-toggle');
      var menu = document.getElementById('nav-more-menu');
      if (!toggle || !menu) return;
      function place() {
        var r = toggle.getBoundingClientRect();
        menu.style.top = (r.bottom + 10) + 'px';
        menu.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
      }
      function open() { place(); menu.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
      function close() { menu.classList.remove('open'); toggle.setAttribute('aria-expanded', 'false'); }
      toggle.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        menu.classList.contains('open') ? close() : open();
      });
      document.addEventListener('click', function (e) {
        if (menu.classList.contains('open') && !menu.contains(e.target) && !toggle.contains(e.target)) close();
      });
      window.addEventListener('scroll', function () { if (menu.classList.contains('open')) place(); }, { passive: true });
      window.addEventListener('resize', function () { if (menu.classList.contains('open')) place(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  </script>
